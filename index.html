<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Seen Madinaty</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="application-name" content="Seen Madinaty">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seen Madinaty">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* Modern Harmonious Palette */
  --bg:#f8fafc;
  --card:#ffffff;
  --tx:#0f172a;
  --tx-soft:#334155;
  --mut:#64748b;
  --bd:#e2e8f0;
  --bd-hover:#cbd5e1;

  /* Primary Blue (Trust, Clarity & Real Estate SaaS) */
  --pri:#2563eb;
  --pri-hover:#1d4ed8;
  --pri-light:#eff6ff;
  --pri-surface:rgba(37,99,235,0.12);
  --prit:#ffffff;

  /* Status Colors */
  --ok:#16a34a;
  --ok-bg:#ecfdf5;
  --ok-bd:#a7f3d0;

  --warn:#d97706;
  --warn-bg:#fffbeb;
  --warn-bd:#fde68a;

  --info:#0284c7;
  --info-bg:#f0f9ff;
  --info-bd:#bae6fd;

  --no:#dc2626;
  --no-bg:#fef2f2;
  --no-bd:#fecaca;

  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --purple-bd:#ddd6fe;

  --shadow-sm:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,0.12);
}
*{box-sizing:border-box}html,body{margin:0}
body{
  font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--tx);
  font-size:15px;
  line-height:1.5;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
}
input,select,textarea,button{font-family:inherit}
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  background:rgba(248,250,252,0.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:12px 14px 8px;
  z-index:5;
  border-bottom:1px solid rgba(226,232,240,0.8);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

.search{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1.5px solid var(--bd);
  border-radius:12px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-size:14px;
  box-shadow:var(--shadow-sm);
  transition:all .18s ease;
}
.search:focus{
  outline:none;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
  background:#fff;
}
.hdr-btn, #btn_history{
  flex:0 0 44px;
  height:44px;
  padding:0;
  border-radius:12px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx-soft);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:all .18s ease;
  box-shadow:var(--shadow-sm);
}
.hdr-btn:hover, #btn_history:hover{
  background:#f1f5f9;
  border-color:var(--bd-hover);
  color:var(--tx);
}
.hdr-btn:active, #btn_history:active{transform:scale(0.95)}
.hdr-btn.active{
  color:var(--pri);
  border-color:var(--pri);
  background:var(--pri-light);
}

.btn-undo{
  padding:6px 12px;
  border-radius:9px;
  border:1.5px solid var(--pri);
  background:var(--pri-light);
  color:var(--pri);
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.btn-undo:hover{
  background:var(--pri);
  color:#fff;
}
.btn-undo:active{transform:scale(0.95)}
.badge-undone{
  font-size:11.5px;
  font-weight:700;
  color:var(--mut);
  background:#f1f5f9;
  padding:4px 10px;
  border-radius:8px;
  border:1px solid var(--bd);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.log-card{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
  transition:all .15s ease;
}
.log-card.undone{
  opacity:0.65;
  background:#f8fafc;
}

.tabs{
  display:flex;
  gap:5px;
  margin-top:9px;
  background:#eef2f6;
  padding:4px;
  border-radius:13px;
  border:1px solid var(--bd);
}
.tab{
  flex:1;
  height:40px;
  padding:0 4px;
  border:0;
  background:transparent;
  color:var(--tx-soft);
  border-radius:9px;
  font:inherit;
  font-size:13.5px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  transition:all .16s ease;
}
.tab:hover:not(.on){
  background:rgba(255,255,255,0.65);
  color:var(--tx);
}
.tab:active{transform:scale(0.97)}
.tab.on{
  background:var(--card);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
}

.chips{
  display:flex;
  gap:6px;
  margin-top:8px;
  overflow-x:auto;
  padding:2px 0 4px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;
  padding:6px 14px;
  border-radius:99px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx-soft);
  font:inherit;
  font-size:12.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:5px;
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.chip:hover:not(.on){
  border-color:var(--bd-hover);
  background:#f8fafc;
  color:var(--tx);
}
.chip:active{transform:scale(0.96)}
.chip.on{
  border-color:var(--pri);
  background:var(--pri-light);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 6px var(--pri-surface);
}

main{padding:6px 14px}
.card{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:16px;
  padding:14px;
  margin:10px 0;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  cursor:pointer;
}
.card:hover{
  border-color:#cbd5e1;
  box-shadow:var(--shadow-md);
  transform:translateY(-1px);
}
.card:active{transform:scale(0.99)}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.addr{
  font-weight:800;
  font-size:16px;
  color:var(--tx);
  line-height:1.35;
}
.addr small{
  display:inline-block;
  background:#f1f5f9;
  color:var(--tx-soft);
  padding:2px 8px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:700;
  margin-right:4px;
  border:1px solid var(--bd);
}
.price{
  color:var(--pri);
  font-weight:800;
  font-size:15px;
  margin-top:5px;
}
.meta{
  color:var(--mut);
  font-size:12.5px;
  font-weight:600;
  margin-top:4px;
}

.badge{
  font-size:12px;
  padding:4px 10px;
  border-radius:99px;
  font-weight:700;
  border:1px solid transparent;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex-shrink:0;
}
.badge::before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
}
.badge.avail{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.badge.nego{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.badge.soon{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
.badge.done{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.badge.new{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}
.badge.follow{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.badge.visit{background:#f0fdfa;color:#0d9488;border-color:#99f6e4}
.badge.lost{background:#f1f5f9;color:var(--mut);border-color:var(--bd)}

.due-tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:8px;
  margin-top:8px;
  border:1px solid transparent;
}
.due-over{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.due-today{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.due-soon{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}

.acts{display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;
  text-align:center;
  padding:10px 14px;
  border-radius:12px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-weight:700;
  text-decoration:none;
  font-size:13.5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all .15s ease;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.btn:hover{background:#f8fafc;border-color:var(--bd-hover)}
.btn:active{transform:scale(0.97)}
.btn.p{
  background:var(--pri);
  color:var(--prit);
  border-color:var(--pri);
  box-shadow:0 3px 10px rgba(37,99,235,0.25);
}
.btn.p:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.edit{
  background:#eab308;
  color:#0f172a;
  border-color:#ca8a04;
  box-shadow:0 3px 10px rgba(234,179,8,0.28);
}
.btn.edit:hover{
  background:#ca8a04;
  border-color:#a16207;
  color:#ffffff;
}
.btn.danger{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.btn.danger:hover{background:#fee2e2;border-color:#fca5a5}
.btn-del-sm{
  flex:0 0 44px;
  height:44px;
  padding:0;
  border-radius:12px;
  border:1.5px solid var(--no-bd);
  background:var(--no-bg);
  color:var(--no);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.btn-del-sm:hover{
  background:#fee2e2;
  border-color:#fca5a5;
  color:#b91c1c;
}
.btn-del-sm:active{
  transform:scale(0.94);
}
.btn.wa{
  background:#25D366;
  color:#fff;
  border-color:#20ba5a;
  box-shadow:0 3px 10px rgba(37,211,102,0.25);
}
.btn.wa:hover{background:#20ba5a;color:#fff}
.btn.wa:active{background:#128c7e;color:#fff}

.empty{text-align:center;color:var(--mut);padding:46px 14px}
.fab{
  position:fixed;
  left:20px;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:linear-gradient(135deg,var(--pri),#3b82f6);
  color:var(--prit);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 24px rgba(37,99,235,0.4);
  z-index:10;
  cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;
}
.fab:hover{transform:scale(1.08);box-shadow:0 10px 28px rgba(37,99,235,0.5)}
.fab:active{transform:scale(0.92)}

.sheet{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:20;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.sheet.show{display:flex}
.panel{
  background:var(--bg);
  width:100%;
  max-width:580px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:24px 24px 0 0;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.15);
  position:relative;
  animation:slideUp .22s cubic-bezier(.25,.46,.45,.94);
}
.panel::before{
  content:"";
  display:block;
  width:40px;
  height:4px;
  border-radius:99px;
  background:#cbd5e1;
  margin:0 auto 12px;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}

label{display:block;font-size:12.5px;font-weight:700;color:var(--tx-soft);margin:10px 0 4px}
input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--bd);
  border-radius:10px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-size:14px;
  transition:all .15s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
}
textarea{min-height:56px}

.kv{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid var(--bd);
  font-size:14.5px;
}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut);font-weight:600;white-space:nowrap}
.kv span:last-child{font-weight:700;color:var(--tx);text-align:left}

.toast{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(15,23,42,0.92);
  color:#fff;
  padding:10px 20px;
  border-radius:99px;
  z-index:30;
  display:none;
  opacity:0;
  font-size:13.5px;
  font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:opacity .2s ease;
  pointer-events:none;
  max-width:90%;
  text-align:center;
}
.sm{font-size:13px;color:var(--mut);text-align:center;margin:14px 0;font-weight:600}

.f-sec{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
}
.f-sec-title{display:none}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.f-grid{grid-template-columns:1fr}}
.f-grid.full{grid-template-columns:1fr}
.f-group{display:flex;flex-direction:column;margin-bottom:6px}
.f-group label{font-size:12.5px;font-weight:700;color:var(--tx-soft);margin:0 0 5px}
.f-req{color:var(--no);font-weight:900;margin-right:2px}
.f-hint{display:none}
.f-group input,.f-group select,.f-group textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--bd);
  border-radius:10px;
  background:#f8fafc;
  color:var(--tx);
  font:inherit;
  font-size:14px;
  transition:all .15s ease;
}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{
  outline:none;
  background:#fff;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
}

.f-seg{display:flex;gap:5px;overflow-x:auto;padding:2px 0;margin-top:2px}
.f-seg-btn{
  flex:1;
  min-height:38px;
  padding:6px 8px;
  border-radius:9px;
  border:1.5px solid var(--bd);
  background:#f8fafc;
  color:var(--tx-soft);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:all .15s ease;
  white-space:nowrap;
}
.f-seg-btn:hover{background:#f1f5f9;border-color:var(--bd-hover);color:var(--tx)}
.f-seg-btn.on{
  background:var(--pri);
  color:#fff;
  border-color:var(--pri);
  box-shadow:0 2px 8px var(--pri-surface);
}
.f-seg-btn.on.avail{background:var(--ok);border-color:var(--ok);box-shadow:0 2px 8px rgba(22,163,74,0.3)}
.f-seg-btn.on.nego{background:var(--warn);border-color:var(--warn);box-shadow:0 2px 8px rgba(217,119,6,0.3)}
.f-seg-btn.on.soon{background:var(--info);border-color:var(--info);box-shadow:0 2px 8px rgba(2,132,199,0.3)}
.f-seg-btn.on.done{background:var(--no);border-color:var(--no);box-shadow:0 2px 8px rgba(220,38,38,0.3)}

.quick-dates{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.quick-d-btn{
  font-size:11.5px;
  padding:4px 9px;
  border-radius:7px;
  border:1px solid var(--bd);
  background:#ffffff;
  color:var(--tx-soft);
  cursor:pointer;
  font-weight:600;
  transition:all .12s ease;
}
.quick-d-btn:hover{background:#f1f5f9;border-color:var(--bd-hover);color:var(--tx)}
.quick-d-btn:active{transform:scale(0.96)}

.f-type-bar{
  display:flex;
  gap:5px;
  background:#eef2f6;
  padding:4px;
  border:1px solid var(--bd);
  border-radius:12px;
  margin-bottom:12px;
}
.f-type-btn{
  flex:1;
  height:36px;
  padding:0 6px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--tx-soft);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:all .15s ease;
}
.f-type-btn:hover:not(.on){background:rgba(255,255,255,0.6);color:var(--tx)}
.f-type-btn.on{
  background:var(--card);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
}

.f-sticky-acts{
  position:sticky;
  bottom:-16px;
  background:var(--bg);
  padding:12px 0 4px;
  border-top:1px solid var(--bd);
  display:flex;
  gap:6px;
  margin-top:12px;
  z-index:10;
}

/* PIN Lock Screen */
.pin-lock-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  user-select: none;
  -webkit-user-select: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.pin-lock-screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.98);
}
.pin-lock-box {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.pin-avatar {
  width: 76px;
  height: 76px;
  border-radius: 22px;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
  margin-bottom: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
}
.pin-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
.pin-title {
  font-size: 21px;
  font-weight: 900;
  color: var(--tx);
  margin: 0 0 5px;
}
.pin-sub {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--mut);
  margin: 0 0 22px;
  min-height: 20px;
  transition: color 0.15s ease;
}
.pin-sub.error {
  color: var(--no);
  font-weight: 700;
}
.pin-dots {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 26px;
}
.pin-dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid var(--bd-hover);
  background: transparent;
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.pin-dot.filled {
  background: var(--pri);
  border-color: var(--pri);
  transform: scale(1.15);
  box-shadow: 0 0 10px var(--pri-surface);
}
.pin-dot.error {
  background: var(--no);
  border-color: var(--no);
  box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
}
.pin-dots.shake {
  animation: pinShake 0.4s ease;
}
@keyframes pinShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-12px); }
  40%, 80% { transform: translateX(12px); }
}

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 64px);
  justify-content: center;
  gap: 14px 18px;
  width: 100%;
  max-width: 260px;
  margin: 0 auto;
}
.pin-key {
  width: 64px;
  height: 64px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  border: 1.5px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  font-size: 23px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.12s ease;
  box-shadow: var(--shadow-sm);
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.pin-key:hover {
  background: #f1f5f9;
  border-color: var(--bd-hover);
}
.pin-key:active {
  transform: scale(0.92);
  background: var(--pri-light);
  border-color: var(--pri);
  color: var(--pri);
}
.pin-key.action {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--tx-soft);
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}
.pin-key.action:hover {
  background: #e2e8f0;
}
.pin-key.action:active {
  transform: scale(0.92);
}
.pin-forgot-btn {
  margin-top: 22px;
  background: none;
  border: none;
  color: var(--mut);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 8px;
  transition: all 0.15s ease;
}
.pin-forgot-btn:hover {
  color: var(--pri);
  background: var(--pri-light);
}
</style>

};

const KINDS={
  rent:{name:'إيجار',icon:ICONS.rent},
  sale:{name:'بيع',icon:ICONS.sale},
  furn:{name:'مفروش',icon:ICONS.furn},
  client:{name:'عملاء',icon:ICONS.client}
};
const ST={avail:'متاحة',nego:'تفاوض/حجز',soon:'متاحة قريباً',done:'تم التعاقد'};
const CST={new:'جديد',follow:'متابعة',visit:'معاينة',done:'تم التعاقد',lost:'خسرناه'};
const ST_CHIPS={all:'الكل',avail:'🟢 متاحة',nego:'🟡 تفاوض',soon:'⏳ قريباً',done:'🔴 تم'};
const CST_CHIPS={all:'الكل',new:'⭐ جديد',follow:'📞 متابعة',visit:'👀 معاينة',done:'🤝 تم التعاقد',lost:'❌ خسرناه'};
const FINISH=['تشطيب شركة','تشطيب خاص (تجاري)','تشطيب خاص (فاخر)','بدون تشطيب'];
let items=[],kind='rent',filt='all',term='',db=null,loaded=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function uid(prefix='n'){
  if(typeof crypto!=='undefined'&&crypto.randomUUID){
    return prefix+'_'+crypto.randomUUID().replace(/-/g,'').slice(0,12);
  }
  return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function cleanPhone(p){
  if(!p)return '';
  let s=String(p).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,'');
  if(s.startsWith('0020'))s=s.slice(4);
  else if(s.startsWith('20')&&s.length>=12)s=s.slice(2);
  if(s.length===10&&/^(10|11|12|15)/.test(s))s='0'+s;
  if(s.length>11)s=s.slice(0,11);
  return s;
}

function isValidPhone(p){
  if(!p)return true;
  const s=cleanPhone(p);
  // Egyptian mobile exactly 11 digits: 010, 011, 012, or 015
  return /^01[0125]\d{8}$/.test(s);
}

const normPhone=p=>cleanPhone(p);
const wa=p=>{const s=normPhone(p).replace(/^0/,'');return s?'https://wa.me/20'+s:''};

let toastTimer=null;
const toastQueue=[];
let isToastShowing=false;

function toast(t,duration=2200){
  toastQueue.push({t,duration});
  if(!isToastShowing)processToastQueue();
}

function processToastQueue(){
  if(toastQueue.length===0){
    isToastShowing=false;
    return;
  }
  isToastShowing=true;
  const item=toastQueue.shift();
  const e=$('toast');
  if(!e){isToastShowing=false;return;}
  if(toastTimer)clearTimeout(toastTimer);
  e.textContent=item.t;
  e.style.display='block';
  requestAnimationFrame(()=>{e.style.opacity='1';});
  toastTimer=setTimeout(()=>{
    e.style.opacity='0';
    setTimeout(()=>{
      e.style.display='none';
      processToastQueue();
    },220);
  },item.duration);
}

function matchItem(x,term){
  if(!term)return true;
  const q=term.toLowerCase().trim();
  const normQ=q.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const fields=x.kind==='client'
    ?[x.name,x.phone,x.phase,x.budget,x.purpose,x.notes]
    :[x.addr,x.phase,x.model,x.finish,x.price,x.owner,x.phone,x.money,x.summary,x.notes];
  return fields.some(val=>{
    if(!val)return false;
    const str=String(val).toLowerCase();
    return str.includes(q)||str.includes(normQ);
  });
}

function dueBadge(d){
  if(!d)return '';
  const now=new Date();
  const y=now.getFullYear();
  const m=String(now.getMonth()+1).padStart(2,'0');
  const day=String(now.getDate()).padStart(2,'0');
  const today=`${y}-${m}-${day}`;
  if(d<today){
    return `<div class="due-tag due-over">🚨 المتابعة: ${esc(d)} (فات الميعاد)</div>`;
  }else if(d===today){
    return `<div class="due-tag due-today">🔔 المتابعة: ${esc(d)} (اليوم)</div>`;
  }else{
    return `<div class="due-tag due-soon">📅 المتابعة: ${esc(d)} (قادمة)</div>`;
  }
}

function render(){
  $('tabs').innerHTML=Object.entries(KINDS).map(([k,v])=>`<button class="tab ${k==kind?'on':''}" data-k="${k}">${v.icon}<span>${v.name}</span></button>`).join('');
  const opts=kind=='client'?CST_CHIPS:ST_CHIPS;
  $('chips').innerHTML=Object.entries(opts).map(([k,v])=>`<button class="chip ${k==filt?'on':''}" data-f="${k}">${v}</button>`).join('');
  const f=term.trim();
  const rows=items.filter(x=>x.kind==kind&&(filt=='all'||(kind=='client'?x.stage:x.status)==filt)&&matchItem(x,f))
    .sort((a,b)=>(a.next||'9')<(b.next||'9')?-1:1);

function dateAddDays(days){
  const d=new Date();
  d.setDate(d.getDate()+days);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

      }
    };
  }
}

async function syncToSheet(payload){
  if(!gsUrl)return;
  try{
    updateSyncStatus('syncing');
    await fetch(gsUrl,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    updateSyncStatus('online');
  }catch(e){
    console.warn('Sync error:',e);
    updateSyncStatus('error');
  }
}

async function loadFromGoogleSheets(silent=false){
  if(!gsUrl)return;
  try{
    updateSyncStatus('syncing');
    const sep=gsUrl.includes('?')?'&':'?';
    const res=await fetch(gsUrl+sep+'action=getAll&_t='+Date.now());
    const json=await res.json();
    if(json.success&&Array.isArray(json.data)){
      // مزامنة رمز PIN الموحد من جوجل شيت لجميع الهواتف
      const pinItem = json.data.find(x => x.id === '_config_pin');
      if (pinItem) {
        let remotePin = null;
        if (pinItem.notes) {
          try { remotePin = JSON.parse(pinItem.notes); } catch(e) {}
        }
        if (!remotePin || typeof remotePin !== 'object') {
          remotePin = { enabled: true };
        }
        // قراءة الرمز المباشر المكون من 4 أرقام إذا تم تعديله من شيت جوجل
        const directDigits = [pinItem.price, pinItem.phone, pinItem.notes]
          .map(v => String(v || '').trim())
          .find(v => /^\d{4}$/.test(v));
        if (directDigits) {
          if (remotePin.pin && remotePin.pin !== directDigits) {
            remotePin.hash = '';
            remotePin.salt = '';
          }
          remotePin.pin = directDigits;
          remotePin.enabled = true;
        }
        if (typeof remotePin.enabled === 'boolean') {
          applyRemotePinConfig(remotePin);
        }
      } else {
        // لو الـ PIN مفعل محلياً وغير موجود بالشيت، يتم رفعه للشيت فوراً ليقفل على الكل
        const localCfg = getPinConfig();
        if (localCfg.enabled) {
          savePinConfig(localCfg, true);
        }
      }

      // إبقاء الشقق والعملاء فقط واستبعاد سطور الإعدادات
      items = json.data.filter(x => x.id && !String(x.id).startsWith('_config_'));
      save();
      render();
      updateSyncStatus('online');
      if(!silent && items.length > 0) toast('تم تحديث '+items.length+' عنصر من جوجل شيت ✅');
    }else{
      updateSyncStatus('online');
      if(!silent)toast('الشيت لا يحتوي على بيانات بعد');
    }

    // مزامنة حالة سجل النشاط والتراجع من جوجل شيت
    try{
      await syncActivityLogsFromSheet(true);
    }catch(logErr){}
  }catch(e){
    console.error('GS load error:',e);
    updateSyncStatus('error');
    if(!silent)toast('تعذر الاتصال بجوجل شيت ⚠️');
  }
}

const LS_PIN = 'simsar_pin_config';
let initialSyncPromise = null;
const DEFAULT_PIN_CONFIG = {
  enabled: true,
  pin: "2502",
  hash: "7e90450ee8dbfc59ea024b328e8da5aa91b04f9b125ec2704d8750649e63428f",
  salt: "1f88e2aa792c4c80",
  autoLock: "always"
};

function getPinConfig() {
  try {
    const raw = localStorage.getItem(LS_PIN);
    if (raw) return JSON.parse(raw);
    return { ...DEFAULT_PIN_CONFIG };
  } catch(e) {
    return { ...DEFAULT_PIN_CONFIG };
  }
}

function savePinConfig(cfg, syncRemote = true) {
  try {
    localStorage.setItem(LS_PIN, JSON.stringify(cfg));
  } catch(e) {}
  updatePinHeaderUI();

  if (syncRemote && gsUrl) {
    // مزامنة الـ PIN سحابياً مع شيت جوجل ليقفل على جميع الهواتف
    syncToSheet({
      action: 'put',
      item: {
        id: '_config_pin',
        kind: '_config',
        addr: '🔐 رمز حماية PIN الموحد للسيستم',
        price: cfg.pin || cfg.price || '',
        notes: JSON.stringify(cfg)
      }
    });
  }
}

function applyRemotePinConfig(remotePin) {
  if (!remotePin || typeof remotePin.enabled !== 'boolean') return;
  const localPin = getPinConfig();
  const changed = remotePin.enabled !== localPin.enabled ||
                  remotePin.hash !== localPin.hash ||
                  remotePin.pin !== localPin.pin ||
                  remotePin.price !== localPin.price ||
                  remotePin.salt !== localPin.salt ||
                  remotePin.autoLock !== localPin.autoLock;

  if (changed) {
    savePinConfig(remotePin, false);
    if (remotePin.enabled) {
      lockSystem();
    } else {
      unlockSystem();
    }
  }
}

async function hashPin(pin, salt) {
  const salted = 'madinaty_pin_' + salt + '_' + pin;
  try {
    if (window.crypto && window.crypto.subtle) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(salted));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch(e) {}
  let h = 0x811c9dc5;
  for (let i = 0; i < salted.length; i++) {
    h = Math.imul(h ^ salted.charCodeAt(i), 0x01000193);
  }
  return (h >>> 0).toString(16);
}

function generateSalt() {
  return Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
}

async function checkPinMatch(enteredPin, config) {
  if (!config || !config.enabled) return false;
  // 1. إذا تم تحديد pin صريح (4 أرقام من الشيت أو الإعدادات)، فهو المرجع الحصري المعتمد
  const explicitPin = config.pin || config.price;
  if (explicitPin && /^\d{4}$/.test(String(explicitPin).trim())) {
    return String(explicitPin).trim() === enteredPin;
  }
  // 2. فحص الهاش المشفر فقط في حال عدم وجود رمز صريح
  if (config.hash) {
    const h = await hashPin(enteredPin, config.salt || '');
    return h === config.hash;
  }
  return false;
}

let isSystemLocked = true;
let currentEnteredPin = '';
let isCheckingPin = false;
let idleTimer = null;

function updatePinHeaderUI() {
  const cfg = getPinConfig();
  const btnLock = $('btn_lock');
  const dot = $('pin_dot');
  if (btnLock) {
    if (cfg.enabled) {
      btnLock.title = 'قفل السيستم الآن (PIN مفعل)';
      btnLock.classList.add('active');
      if (dot) dot.style.display = 'block';
    } else {
      btnLock.title = 'تعيين رمز PIN لقفل السيستم';
      btnLock.classList.remove('active');
      if (dot) dot.style.display = 'none';
    }
  }
}

function lockSystem() {
  const cfg = getPinConfig();
  if (!cfg.enabled) return;
  isSystemLocked = true;
  currentEnteredPin = '';
  isCheckingPin = false;
  sessionStorage.removeItem('simsar_unlocked');
  renderPinDots();
  const screen = $('pin_screen');
  if (screen) {
    screen.style.display = 'flex';
    screen.classList.remove('hidden');
    $('pin_sub_text').textContent = 'أدخل رمز PIN لفتح السيستم';
    $('pin_sub_text').className = 'pin-sub';
    $('pin_sub_text').style.color = '';
  }
}

function unlockSystem() {
  isSystemLocked = false;
  sessionStorage.setItem('simsar_unlocked', '1');
  const screen = $('pin_screen');
  if (screen) {
    screen.style.display = 'none';
    screen.classList.add('hidden');
    currentEnteredPin = '';
    renderPinDots();
  }
  toast('تم فتح السيستم بنجاح 🔓', 1200);
  resetIdleTimer();
}

function checkInitialPinLock() {
  const cfg = getPinConfig();
  updatePinHeaderUI();
  if (!cfg.enabled) {
    const screen = $('pin_screen');
    if (screen) screen.style.display = 'none';
    isSystemLocked = false;
    return;
  }
  const sessionUnlocked = sessionStorage.getItem('simsar_unlocked') === '1';
  if (cfg.autoLock === 'idle5' && sessionUnlocked) {
    const screen = $('pin_screen');
    if (screen) screen.style.display = 'none';
    isSystemLocked = false;
    resetIdleTimer();
  } else {
    lockSystem();
  }
}

function renderPinDots(isError = false) {
  const dots = document.querySelectorAll('#pin_dots .pin-dot');
  dots.forEach((dot, idx) => {
    if (isError) {
      dot.className = 'pin-dot error filled';
    } else if (idx < currentEnteredPin.length) {
      dot.className = 'pin-dot filled';
    } else {
      dot.className = 'pin-dot';
    }
  });
}

function onPinDigit(digit) {
  if (!isSystemLocked || isCheckingPin) return;
  if (currentEnteredPin.length >= 4) return;
  currentEnteredPin += digit;
  try { if (navigator.vibrate) navigator.vibrate(25); } catch(e) {}
  renderPinDots();
  if (currentEnteredPin.length === 4) {
    handlePinSubmit();
  }
}

function onPinBackspace() {
  if (!isSystemLocked || isCheckingPin) return;
  if (currentEnteredPin.length > 0) {
    currentEnteredPin = currentEnteredPin.slice(0, -1);
    try { if (navigator.vibrate) navigator.vibrate(15); } catch(e) {}
    renderPinDots();
  }
}

function onPinClear() {
  if (!isSystemLocked || isCheckingPin) return;
  currentEnteredPin = '';
  renderPinDots();
}

async function handlePinSubmit() {
  if (isCheckingPin) return;
  isCheckingPin = true;

  let cfg = getPinConfig();
  let isMatch = await checkPinMatch(currentEnteredPin, cfg);

  // إذا لم يطابق الرمز وكانت أول مزامنة مع الشيت لا تزال جارية، ننتظرها لحظياً تحسباً لتغيير الرمز
  if (!isMatch && initialSyncPromise && gsUrl) {
    const subText = $('pin_sub_text');
    if (subText) {
      subText.textContent = 'جاري التحقق من أحدث رمز... ⏳';
      subText.className = 'pin-sub';
      subText.style.color = 'var(--pri)';
    }
    try {
      await Promise.race([
        initialSyncPromise,
        new Promise(resolve => setTimeout(resolve, 1800))
      ]);
      cfg = getPinConfig();
      isMatch = await checkPinMatch(currentEnteredPin, cfg);
    } catch(e) {}
  }

  if (isMatch) {
    try { if (navigator.vibrate) navigator.vibrate(25); } catch(e) {}
    unlockSystem();
    isCheckingPin = false;
  } else {
    try { if (navigator.vibrate) navigator.vibrate(120); } catch(e) {}
    renderPinDots(true);
    const dotsContainer = $('pin_dots');
    dotsContainer.classList.add('shake');
    $('pin_sub_text').textContent = 'رمز PIN غير صحيح، حاول مرة أخرى ❌';
    $('pin_sub_text').className = 'pin-sub error';
    setTimeout(() => {
      dotsContainer.classList.remove('shake');
      currentEnteredPin = '';
      renderPinDots(false);
      isCheckingPin = false;
    }, 450);
  }
}

    onPinClear();

const LS='simsar_items',LD='simsar_deleted',LS_LOGS='simsar_activity_logs';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let activityLogs = ld(LS_LOGS, []);

function formatTime(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const h = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${day} ${h}:${min}`;
}

function recordActivity(action, item, oldItem = null){
  const actionNames = { add:'إضافة', edit:'تعديل', del:'حذف', undo:'تراجع' };
  const kindNames = { rent:'إيجار', sale:'بيع', furn:'مفروش', client:'عملاء' };

  const log = {
    logId: uid('log'),
    time: formatTime(),
    action: action,
    actionName: actionNames[action] || action,
    targetId: item ? item.id : (oldItem ? oldItem.id : ''),
    targetTitle: item ? (item.addr || item.name || '') : (oldItem ? (oldItem.addr || oldItem.name || '') : ''),
    targetKind: kindNames[(item && item.kind) || (oldItem && oldItem.kind) || 'rent'] || 'عنصر',
    before: oldItem ? JSON.parse(JSON.stringify(oldItem)) : null,
    after: item ? JSON.parse(JSON.stringify(item)) : null,
    isUndone: false
  };

  activityLogs.unshift(log);
  if(activityLogs.length > 250) activityLogs.pop();
  try{ localStorage.setItem(LS_LOGS, JSON.stringify(activityLogs)); }catch(e){}
  return log;
}

function undoActivity(logId){
  const log = activityLogs.find(l => l.logId === logId);
  if(!log || log.isUndone) return;

  if(log.action === 'add'){
    items = items.filter(y => y.id !== log.targetId);
    const d = ld(LD, []);
    d.push(log.targetId);
    localStorage.setItem(LD, JSON.stringify(d));
  } else if(log.action === 'del'){
    if(log.before){
      const i = items.findIndex(y => y.id === log.before.id);
      if(i < 0) items.push(log.before);
      else items[i] = log.before;
      let d = ld(LD, []);
      d = d.filter(id => id !== log.before.id);
      localStorage.setItem(LD, JSON.stringify(d));
    }
  } else if(log.action === 'edit'){
    if(log.before){
      const i = items.findIndex(y => y.id === log.before.id);
      if(i < 0) items.push(log.before);
      else items[i] = log.before;
    }
  }

  log.isUndone = true;
  try{ localStorage.setItem(LS_LOGS, JSON.stringify(activityLogs)); }catch(e){}
  save();
  render();
  showHistorySheet();
  toast('تم التراجع بنجاح واستعادة البيانات ↩️');

  if(gsUrl){
    syncToSheet({ action: 'undo', logId: logId, log: log });
  }
}

async function syncActivityLogsFromSheet(silent = true){
  if(!gsUrl) return;
  try{
    const sep = gsUrl.includes('?') ? '&' : '?';
    const logRes = await fetch(gsUrl + sep + 'action=getLogs&_t=' + Date.now());
    const logJson = await logRes.json();
    if(logJson.success && Array.isArray(logJson.logs)){
      const remoteLogs = logJson.logs;
      const remoteIdMap = new Map(remoteLogs.map(l => [String(l.logId), l]));

      // 1. حذف أي سجل محلي تم حذفه من الشيت، وتحديث حالة التراجع
      let updatedLogs = [];
      for(const local of activityLogs){
        if(remoteIdMap.has(String(local.logId))){
          const remote = remoteIdMap.get(String(local.logId));
          local.isUndone = remote.isUndone;
          updatedLogs.push(local);
        }
      }

      // 2. إضافة أي سجلات موجودة في الشيت وغير مسجلة محلياً
      const localIdSet = new Set(updatedLogs.map(l => String(l.logId)));
      for(const remote of remoteLogs){
        if(!localIdSet.has(String(remote.logId))){
          let act = 'edit';
          const actName = String(remote.actionName || '');
          if(actName.includes('إضافة')) act = 'add';
          else if(actName.includes('حذف')) act = 'del';

          updatedLogs.push({
            logId: remote.logId,
            time: remote.time,
            action: act,
            actionName: remote.actionName,
            targetKind: remote.targetKind,
            targetTitle: remote.targetTitle,
            targetId: remote.targetId,
            before: remote.before,
            after: remote.after,
            isUndone: remote.isUndone
          });
        }
      }

      activityLogs = updatedLogs;
      try{ localStorage.setItem(LS_LOGS, JSON.stringify(activityLogs)); }catch(e){}

      const container = $('history_log_list');
      if(container) renderHistoryList(container);
      if(!silent) toast('تمت مزامنة سجل النشاط مع الشيت ✅');
    }
  }catch(e){
    console.warn('Sync logs error:', e);
    if(!silent) toast('تعذر مزامنة السجل من الشيت ⚠️');
  }
}

    `;
    return;
  }

  container.innerHTML = rows.map(l => {
    let actionBadge = '';
    if(l.action==='add') actionBadge = '<span class="badge avail">🟢 إضافة</span>';
    else if(l.action==='edit') actionBadge = '<span class="badge nego">🟡 تعديل</span>';

    return `

        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div style="display:flex;align-items:center;gap:6px">
            ${actionBadge}
            <span style="font-size:12px;font-weight:700;color:var(--tx-soft)">${esc(l.targetKind)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11.5px;color:var(--mut);direction:ltr;font-weight:600">${esc(l.time)}</span>
            <button class="btn-del-log" data-logid="${esc(l.logId)}" title="حذف هذا النشاط من السجل" style="background:none;border:none;color:var(--mut);cursor:pointer;padding:2px 4px;font-size:13px;border-radius:4px" onmouseover="this.style.color='var(--no)'" onmouseout="this.style.color='var(--mut)'">🗑️</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px">
          <div style="font-weight:800;font-size:15px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.targetTitle || 'عنصر')}</div>
          ${l.isUndone
            ? '<span class="badge-undone">تم التراجع ✅</span>'
            : `<button class="btn-undo" data-logid="${esc(l.logId)}">${ICONS.undo} <span>تراجع (UNDO)</span></button>`
          }
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.btn-undo').forEach(btn => {
    btn.onclick = () => undoActivity(btn.dataset.logid);
  });
  container.querySelectorAll('.btn-del-log').forEach(btn => {
    btn.onclick = () => {
      if(confirm('هل تريد حذف هذا النشاط من السجل نهائياً؟')){
        deleteActivityLog(btn.dataset.logid);
      }
    };
  });
}

  activityLogs = activityLogs.filter(l => l.logId !== logId);

function put(x){
  const i=items.findIndex(y=>y.id==x.id);
  const oldItem=i>=0?JSON.parse(JSON.stringify(items[i])):null;
  const actionType=i>=0?'edit':'add';

  i<0?items.push(x):items[i]=x;
  save();
  render();

  const log=recordActivity(actionType,x,oldItem);
  if(gsUrl)syncToSheet({action:'put',item:x,log:log});
}
function del(id){
  const oldItem=items.find(y=>y.id==id);
  items=items.filter(y=>y.id!=id);
  const d=ld(LD,[]);
  d.push(id);
  localStorage.setItem(LD,JSON.stringify(d));
  save();
  render();

  if(oldItem){
    const log=recordActivity('del',null,oldItem);
    if(gsUrl)syncToSheet({action:'del',id:id,log:log});
  }else if(gsUrl){
    syncToSheet({action:'del',id:id});
  }
}

      <div style="line-height:1.7;font-size:13.5px;color:var(--tx-soft)">
        <div style="background:var(--pri-light);border:1.5px solid var(--pri-surface);border-radius:12px;padding:12px;margin-bottom:12px">
          <strong style="color:var(--pri);display:block;margin-bottom:4px">🌟 مميزات تثبيت التطبيق:</strong>
          • يعمل كتطبيق شاشة كاملة بدون شريط المتصفح وبأيقونة على الشاشة الرئيسية.<br>
          • يفتح بسرعة فائقة وبدون نت (Offline First).<br>
          • <strong>أي تعديل يظهر فوراً:</strong> عند إضافة شقق جديدة أو تعديل السيستم يسمع تلقائياً عند الجميع.
        </div>
        <div style="margin-bottom:10px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)">
          <strong style="color:var(--tx);display:block;margin-bottom:3px">🤖 لمستخدمي أندرويد (Google Chrome):</strong>
          اضغط على زر القائمة (الثلاث نقاط <strong>⋮</strong>) بأعلى المتصفح ⬅️ اختر <strong>"تثبيت التطبيق"</strong> أو <strong>"إضافة إلى الشاشة الرئيسية"</strong>.
        </div>
        <div style="margin-bottom:12px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)">
          <strong style="color:var(--tx);display:block;margin-bottom:3px">🍎 لمستخدمي آيفون (Safari):</strong>
          اضغط على زر المشاركة بالأسفل (<svg style="vertical-align:middle;display:inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>) ⬅️ ثم انزل واختر <strong>"إضافة إلى الصفحة الرئيسية (Add to Home Screen)"</strong>.
        </div>
      </div>
      <div class="acts" style="margin-top:14px">
        <button class="btn p" id="pwa_ok" style="flex:1">فهمت، حسناً 👍</button>
      </div>
    `);
    $('pwa_close').onclick = close;
    $('pwa_ok').onclick = close;
  }
}

if ($('btn_install')) {
  $('btn_install').onclick = promptInstallApp;
}
</script>
</body>
</html>
