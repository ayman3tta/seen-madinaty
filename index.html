<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>سين مدينتي | Seen Madinaty</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seen Madinaty">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%231d4ed8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 11 L14 26 L19 26 L19 46 C19 48 20 50 22 50 L42 50 C44 50 45 48 45 46 L45 26 L50 26 Z' fill='rgba(255,255,255,0.18)'/%3E%3Cpath d='M32 11 L51 26 L46.5 29.5 L32 17.5 L17.5 29.5 L13 26 Z' fill='%23ffffff'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-weight='900' font-size='24' fill='%23ffffff' text-anchor='middle'%3E%D8%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="data.js"></script>
<style>
:root{
  box-sizing:border-box;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* Modern Harmonious Palette */
  --bg:#f8fafc;
  --card:#ffffff;
  --tx:#0f172a;
  --tx-soft:#334155;
  --mut:#64748b;
  --bd:#e2e8f0;
  --bd-hover:#cbd5e1;

  /* Primary Blue (Trust, Clarity & Real Estate SaaS) */
  --pri:#2563eb;
  --pri-hover:#1d4ed8;
  --pri-light:#eff6ff;
  --pri-surface:rgba(37,99,235,0.12);
  --prit:#ffffff;

  /* Status Colors */
  --ok:#16a34a;
  --ok-bg:#ecfdf5;
  --ok-bd:#a7f3d0;

  --warn:#d97706;
  --warn-bg:#fffbeb;
  --warn-bd:#fde68a;

  --info:#0284c7;
  --info-bg:#f0f9ff;
  --info-bd:#bae6fd;

  --no:#dc2626;
  --no-bg:#fef2f2;
  --no-bd:#fecaca;

  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --purple-bd:#ddd6fe;

  --shadow-sm:0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.02);
  --shadow-md:0 4px 12px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,0.12);
}
*{box-sizing:border-box}html,body{margin:0}
body{
  font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--tx);
  font-size:15px;
  line-height:1.5;
  padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;
}
input,select,textarea,button{font-family:inherit}
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  background:rgba(248,250,252,0.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:12px 14px 8px;
  z-index:5;
  border-bottom:1px solid rgba(226,232,240,0.8);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

.search{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1.5px solid var(--bd);
  border-radius:12px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-size:14px;
  box-shadow:var(--shadow-sm);
  transition:all .18s ease;
}
.search:focus{
  outline:none;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
  background:#fff;
}
#gear, #btn_history{
  flex:0 0 46px;
  height:46px;
  padding:0;
  border-radius:12px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx-soft);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:all .18s ease;
  box-shadow:var(--shadow-sm);
}
#gear:hover, #btn_history:hover{
  background:#f1f5f9;
  border-color:var(--bd-hover);
  color:var(--tx);
}
#gear:active, #btn_history:active{transform:scale(0.95)}

.btn-undo{
  padding:6px 12px;
  border-radius:9px;
  border:1.5px solid var(--pri);
  background:var(--pri-light);
  color:var(--pri);
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.btn-undo:hover{
  background:var(--pri);
  color:#fff;
}
.btn-undo:active{transform:scale(0.95)}
.badge-undone{
  font-size:11.5px;
  font-weight:700;
  color:var(--mut);
  background:#f1f5f9;
  padding:4px 10px;
  border-radius:8px;
  border:1px solid var(--bd);
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.log-card{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
  transition:all .15s ease;
}
.log-card.undone{
  opacity:0.65;
  background:#f8fafc;
}

.tabs{
  display:flex;
  gap:5px;
  margin-top:9px;
  background:#eef2f6;
  padding:4px;
  border-radius:13px;
  border:1px solid var(--bd);
}
.tab{
  flex:1;
  height:40px;
  padding:0 4px;
  border:0;
  background:transparent;
  color:var(--tx-soft);
  border-radius:9px;
  font:inherit;
  font-size:13.5px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  transition:all .16s ease;
}
.tab:hover:not(.on){
  background:rgba(255,255,255,0.65);
  color:var(--tx);
}
.tab:active{transform:scale(0.97)}
.tab.on{
  background:var(--card);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
}

.chips{
  display:flex;
  gap:6px;
  margin-top:8px;
  overflow-x:auto;
  padding:2px 0 4px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;
  padding:6px 14px;
  border-radius:99px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx-soft);
  font:inherit;
  font-size:12.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:5px;
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.chip:hover:not(.on){
  border-color:var(--bd-hover);
  background:#f8fafc;
  color:var(--tx);
}
.chip:active{transform:scale(0.96)}
.chip.on{
  border-color:var(--pri);
  background:var(--pri-light);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 6px var(--pri-surface);
}

main{padding:6px 14px}
.card{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:16px;
  padding:14px;
  margin:10px 0;
  box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  cursor:pointer;
}
.card:hover{
  border-color:#cbd5e1;
  box-shadow:var(--shadow-md);
  transform:translateY(-1px);
}
.card:active{transform:scale(0.99)}
.row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.addr{
  font-weight:800;
  font-size:16px;
  color:var(--tx);
  line-height:1.35;
}
.addr small{
  display:inline-block;
  background:#f1f5f9;
  color:var(--tx-soft);
  padding:2px 8px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:700;
  margin-right:4px;
  border:1px solid var(--bd);
}
.price{
  color:var(--pri);
  font-weight:800;
  font-size:15px;
  margin-top:5px;
}
.meta{
  color:var(--mut);
  font-size:12.5px;
  font-weight:600;
  margin-top:4px;
}

.badge{
  font-size:12px;
  padding:4px 10px;
  border-radius:99px;
  font-weight:700;
  border:1px solid transparent;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex-shrink:0;
}
.badge::before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
}
.badge.avail{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.badge.nego{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.badge.soon{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
.badge.done{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.badge.new{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}
.badge.follow{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.badge.visit{background:#f0fdfa;color:#0d9488;border-color:#99f6e4}
.badge.lost{background:#f1f5f9;color:var(--mut);border-color:var(--bd)}

.due-tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:8px;
  margin-top:8px;
  border:1px solid transparent;
}
.due-over{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.due-today{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.due-soon{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}

.acts{display:flex;gap:8px;margin-top:10px}
.btn{
  flex:1;
  text-align:center;
  padding:10px 14px;
  border-radius:12px;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-weight:700;
  text-decoration:none;
  font-size:13.5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all .15s ease;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.btn:hover{background:#f8fafc;border-color:var(--bd-hover)}
.btn:active{transform:scale(0.97)}
.btn.p{
  background:var(--pri);
  color:var(--prit);
  border-color:var(--pri);
  box-shadow:0 3px 10px rgba(37,99,235,0.25);
}
.btn.p:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.edit{
  background:#eab308;
  color:#0f172a;
  border-color:#ca8a04;
  box-shadow:0 3px 10px rgba(234,179,8,0.28);
}
.btn.edit:hover{
  background:#ca8a04;
  border-color:#a16207;
  color:#ffffff;
}
.btn.danger{background:var(--no-bg);color:var(--no);border-color:var(--no-bd)}
.btn.danger:hover{background:#fee2e2;border-color:#fca5a5}
.btn-del-sm{
  flex:0 0 44px;
  height:44px;
  padding:0;
  border-radius:12px;
  border:1.5px solid var(--no-bd);
  background:var(--no-bg);
  color:var(--no);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s ease;
  box-shadow:var(--shadow-sm);
}
.btn-del-sm:hover{
  background:#fee2e2;
  border-color:#fca5a5;
  color:#b91c1c;
}
.btn-del-sm:active{
  transform:scale(0.94);
}
.btn.wa{
  background:#25D366;
  color:#fff;
  border-color:#20ba5a;
  box-shadow:0 3px 10px rgba(37,211,102,0.25);
}
.btn.wa:hover{background:#20ba5a;color:#fff}
.btn.wa:active{background:#128c7e;color:#fff}

.empty{text-align:center;color:var(--mut);padding:46px 14px}
.fab{
  position:fixed;
  left:20px;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:linear-gradient(135deg,var(--pri),#3b82f6);
  color:var(--prit);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 24px rgba(37,99,235,0.4);
  z-index:10;
  cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;
}
.fab:hover{transform:scale(1.08);box-shadow:0 10px 28px rgba(37,99,235,0.5)}
.fab:active{transform:scale(0.92)}

.sheet{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:20;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.sheet.show{display:flex}
.panel{
  background:var(--bg);
  width:100%;
  max-width:580px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:24px 24px 0 0;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.15);
  position:relative;
  animation:slideUp .22s cubic-bezier(.25,.46,.45,.94);
}
.panel::before{
  content:"";
  display:block;
  width:40px;
  height:4px;
  border-radius:99px;
  background:#cbd5e1;
  margin:0 auto 12px;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}

label{display:block;font-size:12.5px;font-weight:700;color:var(--tx-soft);margin:10px 0 4px}
input,select,textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--bd);
  border-radius:10px;
  background:var(--card);
  color:var(--tx);
  font:inherit;
  font-size:14px;
  transition:all .15s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
}
textarea{min-height:56px}

.kv{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid var(--bd);
  font-size:14.5px;
}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mut);font-weight:600;white-space:nowrap}
.kv span:last-child{font-weight:700;color:var(--tx);text-align:left}

.toast{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(15,23,42,0.92);
  color:#fff;
  padding:10px 20px;
  border-radius:99px;
  z-index:30;
  display:none;
  opacity:0;
  font-size:13.5px;
  font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:opacity .2s ease;
  pointer-events:none;
  max-width:90%;
  text-align:center;
}
.sm{font-size:13px;color:var(--mut);text-align:center;margin:14px 0;font-weight:600}

.f-sec{
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
}
.f-sec-title{display:none}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.f-grid{grid-template-columns:1fr}}
.f-grid.full{grid-template-columns:1fr}
.f-group{display:flex;flex-direction:column;margin-bottom:6px}
.f-group label{font-size:12.5px;font-weight:700;color:var(--tx-soft);margin:0 0 5px}
.f-req{color:var(--no);font-weight:900;margin-right:2px}
.f-hint{display:none}
.f-group input,.f-group select,.f-group textarea{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--bd);
  border-radius:10px;
  background:#f8fafc;
  color:var(--tx);
  font:inherit;
  font-size:14px;
  transition:all .15s ease;
}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{
  outline:none;
  background:#fff;
  border-color:var(--pri);
  box-shadow:0 0 0 3px var(--pri-surface);
}

.f-seg{display:flex;gap:5px;overflow-x:auto;padding:2px 0;margin-top:2px}
.f-seg-btn{
  flex:1;
  min-height:38px;
  padding:6px 8px;
  border-radius:9px;
  border:1.5px solid var(--bd);
  background:#f8fafc;
  color:var(--tx-soft);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:all .15s ease;
  white-space:nowrap;
}
.f-seg-btn:hover{background:#f1f5f9;border-color:var(--bd-hover);color:var(--tx)}
.f-seg-btn.on{
  background:var(--pri);
  color:#fff;
  border-color:var(--pri);
  box-shadow:0 2px 8px var(--pri-surface);
}
.f-seg-btn.on.avail{background:var(--ok);border-color:var(--ok);box-shadow:0 2px 8px rgba(22,163,74,0.3)}
.f-seg-btn.on.nego{background:var(--warn);border-color:var(--warn);box-shadow:0 2px 8px rgba(217,119,6,0.3)}
.f-seg-btn.on.soon{background:var(--info);border-color:var(--info);box-shadow:0 2px 8px rgba(2,132,199,0.3)}
.f-seg-btn.on.done{background:var(--no);border-color:var(--no);box-shadow:0 2px 8px rgba(220,38,38,0.3)}

.quick-dates{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.quick-d-btn{
  font-size:11.5px;
  padding:4px 9px;
  border-radius:7px;
  border:1px solid var(--bd);
  background:#ffffff;
  color:var(--tx-soft);
  cursor:pointer;
  font-weight:600;
  transition:all .12s ease;
}
.quick-d-btn:hover{background:#f1f5f9;border-color:var(--bd-hover);color:var(--tx)}
.quick-d-btn:active{transform:scale(0.96)}

.f-type-bar{
  display:flex;
  gap:5px;
  background:#eef2f6;
  padding:4px;
  border:1px solid var(--bd);
  border-radius:12px;
  margin-bottom:12px;
}
.f-type-btn{
  flex:1;
  height:36px;
  padding:0 6px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--tx-soft);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:all .15s ease;
}
.f-type-btn:hover:not(.on){background:rgba(255,255,255,0.6);color:var(--tx)}
.f-type-btn.on{
  background:var(--card);
  color:var(--pri);
  font-weight:800;
  box-shadow:0 2px 8px rgba(15,23,42,0.08);
}

.f-sticky-acts{
  position:sticky;
  bottom:-16px;
  background:var(--bg);
  padding:12px 0 4px;
  border-top:1px solid var(--bd);
  display:flex;
  gap:6px;
  margin-top:12px;
  z-index:10;
}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:8px;align-items:center">
    <input id="q" class="search" type="search" placeholder="🔍 ابحث بالاسم أو العنوان أو الرقم">
    <button id="btn_history" title="سجل النشاط والتراجع">

function uid(prefix='n'){
  if(typeof crypto!=='undefined'&&crypto.randomUUID){
    return prefix+'_'+crypto.randomUUID().replace(/-/g,'').slice(0,12);
  }
  return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function cleanPhone(p){
  if(!p)return '';
  let s=String(p).trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,'');
  if(s.startsWith('0020'))s=s.slice(4);
  else if(s.startsWith('20')&&s.length>=12)s=s.slice(2);
  if(s.length===10&&/^(10|11|12|15)/.test(s))s='0'+s;
  if(s.length>11)s=s.slice(0,11);
  return s;
}

function isValidPhone(p){
  if(!p)return true;
  const s=cleanPhone(p);
  // Egyptian mobile exactly 11 digits: 010, 011, 012, or 015
  return /^01[0125]\d{8}$/.test(s);
}

const normPhone=p=>cleanPhone(p);
const wa=p=>{const s=normPhone(p).replace(/^0/,'');return s?'https://wa.me/20'+s:''};

let toastTimer=null;
const toastQueue=[];
let isToastShowing=false;

function toast(t,duration=2200){
  toastQueue.push({t,duration});
  if(!isToastShowing)processToastQueue();
}

function processToastQueue(){
  if(toastQueue.length===0){
    isToastShowing=false;
    return;
  }
  isToastShowing=true;
  const item=toastQueue.shift();
  const e=$('toast');
  if(!e){isToastShowing=false;return;}
  if(toastTimer)clearTimeout(toastTimer);
  e.textContent=item.t;
  e.style.display='block';
  requestAnimationFrame(()=>{e.style.opacity='1';});
  toastTimer=setTimeout(()=>{
    e.style.opacity='0';
    setTimeout(()=>{
      e.style.display='none';
      processToastQueue();
    },220);
  },item.duration);
}

function matchItem(x,term){
  if(!term)return true;
  const q=term.toLowerCase().trim();
  const normQ=q.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const fields=x.kind==='client'
    ?[x.name,x.phone,x.phase,x.budget,x.purpose,x.notes]
    :[x.addr,x.phase,x.model,x.finish,x.price,x.owner,x.phone,x.money,x.summary,x.notes];
  return fields.some(val=>{
    if(!val)return false;
    const str=String(val).toLowerCase();
    return str.includes(q)||str.includes(normQ);
  });
}

function dueBadge(d){
  if(!d)return '';
  const now=new Date();
  const y=now.getFullYear();
  const m=String(now.getMonth()+1).padStart(2,'0');
  const day=String(now.getDate()).padStart(2,'0');
  const today=`${y}-${m}-${day}`;
  if(d<today){
    return `<div class="due-tag due-over">🚨 المتابعة: ${esc(d)} (فات الميعاد)</div>`;
  }else if(d===today){
    return `<div class="due-tag due-today">🔔 المتابعة: ${esc(d)} (اليوم)</div>`;
  }else{
    return `<div class="due-tag due-soon">📅 المتابعة: ${esc(d)} (قادمة)</div>`;
  }
}

function render(){
  $('tabs').innerHTML=Object.entries(KINDS).map(([k,v])=>`<button class="tab ${k==kind?'on':''}" data-k="${k}">${v.icon}<span>${v.name}</span></button>`).join('');
  const opts=kind=='client'?CST_CHIPS:ST_CHIPS;
  $('chips').innerHTML=Object.entries(opts).map(([k,v])=>`<button class="chip ${k==filt?'on':''}" data-f="${k}">${v}</button>`).join('');
  const f=term.trim();
  const rows=items.filter(x=>x.kind==kind&&(filt=='all'||(kind=='client'?x.stage:x.status)==filt)&&matchItem(x,f))
    .sort((a,b)=>(a.next||'9')<(b.next||'9')?-1:1);
  $('list').innerHTML=!loaded?'<div class="empty">⏳ جاري التحميل…</div>':rows.length?rows.map(card).join('')+`<div class="sm">${rows.length} نتيجة</div>`:`<div class="empty"><div style="font-size:40px;margin-bottom:10px">${term?'🔍':'📋'}</div><div style="font-weight:700;color:var(--tx);margin-bottom:4px">${term?'مفيش نتائج للبحث':'لا يوجد إدخالات بعد'}</div><div style="font-size:13px">${term?'جرب كلمة بحث مختلفة':'اضغط ＋ لإضافة أول عنصر'}</div></div>`;
}
function card(x){
  if(x.kind=='client')return `<div class="card" data-id="${x.id}"><div class="row"><div class="addr">${esc(x.name)}</div><span class="badge ${x.stage}">${CST[x.stage]||''}</span></div>
  <div class="price">${esc(x.budget)}</div><div class="meta">${esc(x.purpose)} ${x.phase?'• '+esc(x.phase):''}</div>${dueBadge(x.next)}${acts(x.phone)}</div>`;
  return `<div class="card" data-id="${x.id}"><div class="row"><div class="addr">${esc(x.addr)} ${x.phase?`<small>${esc(x.phase)}</small>`:''}</div><span class="badge ${x.status}">${ST[x.status]}</span></div>
  <div class="price">${esc(x.price)||'السعر غير محدد'}</div><div class="meta">${esc(x.model)} • ${esc(x.finish)}</div>
  ${dueBadge(x.next)}${acts(x.phone)}</div>`;
}

function dateAddDays(days){
  const d=new Date();
  d.setDate(d.getDate()+days);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

  gsUrl=DEFAULT_GS_URL;

function updateSyncStatus(st){
  const dot=$('sync_dot');
  if(!dot)return;
  if(!gsUrl||st=='local'){
    dot.style.display='none';
  } else if(st=='syncing'){
    dot.style.display='block';
    dot.style.background='#f59e0b';
    dot.title='جاري المزامنة مع جوجل شيت...';
  } else if(st=='online'){
    dot.style.display='block';
    dot.style.background='#10b981';
    dot.title='متصل بجوجل شيت وتتم المزامنة بنجاح';
  } else if(st=='error'){
    dot.style.display='block';
    dot.style.background='#ef4444';
    dot.title='تعذر الاتصال بجوجل شيت';
  }
}

async function syncToSheet(payload){
  if(!gsUrl)return;
  try{
    updateSyncStatus('syncing');
    await fetch(gsUrl,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    updateSyncStatus('online');
  }catch(e){
    console.warn('Sync error:',e);
    updateSyncStatus('error');
  }
}

async function loadFromGoogleSheets(silent=false){
  if(!gsUrl)return;
  try{
    updateSyncStatus('syncing');
    const sep=gsUrl.includes('?')?'&':'?';
    const res=await fetch(gsUrl+sep+'action=getAll&_t='+Date.now());
    const json=await res.json();
    if(json.success&&Array.isArray(json.data)&&json.data.length>0){
      items=json.data;
      save();
      render();
      updateSyncStatus('online');
      if(!silent)toast('تم تحديث '+items.length+' عنصر من جوجل شيت ✅');
    }else{
      updateSyncStatus('online');
      if(!silent)toast('الشيت لا يحتوي على بيانات بعد');
    }

    // مزامنة حالة سجل النشاط والتراجع من جوجل شيت
    try{
      const logRes=await fetch(gsUrl+sep+'action=getLogs&_t='+Date.now());
      const logJson=await logRes.json();
      if(logJson.success&&Array.isArray(logJson.logs)){
        logJson.logs.forEach(remoteLog=>{
          const localLog=activityLogs.find(l=>l.logId===remoteLog.logId);
          if(localLog){
            localLog.isUndone=remoteLog.isUndone;
          }
        });
        localStorage.setItem(LS_LOGS,JSON.stringify(activityLogs));
      }
    }catch(logErr){}
  }catch(e){
    console.error('GS load error:',e);
    updateSyncStatus('error');
    if(!silent)toast('تعذر الاتصال بجوجل شيت ⚠️');
  }
}

    <div style="font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--tx)">${ICONS.download} <span>نسخة احتياطية محلية</span></div>

    <div class="acts"><button class="btn" id="im">${ICONS.upload} <span>استيراد نسخة</span></button></div>
    <input type="file" id="fi" accept=".json,.js" style="display:none">
  </div>
  <div class="acts"><button class="btn" id="cl">${ICONS.close} <span>إغلاق</span></button></div>`);

  $('cl').onclick=close;

    close();
    promptInstallApp();
  };
  $('gs_save').onclick=()=>{
    const u=$('gs_inp').value.trim();

    localStorage.setItem(GS_KEY,u);

  };
  $('gs_push').onclick=async()=>{
    const u=$('gs_inp').value.trim()||gsUrl;
    if(!u)return toast('اكتب رابط الـ Web App أولاً');
    toast('جاري رفع '+items.length+' عنصر لشيت جوجل... ⏳');
    try{
      updateSyncStatus('syncing');
      await fetch(u,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'bulkPut',items:items})
      });
      updateSyncStatus('online');
      toast('تم رفع كل البيانات إلى شيت جوجل بنجاح ✅');
    }catch(e){
      console.error(e);
      updateSyncStatus('error');
      toast('حدث خطأ أثناء الرفع، تأكد من إعدادات النشر');
    }
  };
  $('gs_pull').onclick=()=>loadFromGoogleSheets(false);

  $('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:'application/json'}));a.download='simsar-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
  $('im').onclick=()=>$('fi').click();
  $('fi').onchange=async e=>{try{const t=await e.target.files[0].text();const a=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1));if(!confirm('استيراد '+a.length+' عنصر؟ (هيضاف/يتحدّث بنفس الـ id)'))return;a.forEach(x=>{if(!x.id)x.id=uid();const i=items.findIndex(y=>y.id==x.id);i<0?items.push(x):items[i]=x});save();close();render();toast('تم الاستيراد ✅')}catch(err){toast('الملف مش مظبوط')}};
};

$('q').oninput=e=>{term=e.target.value;render()};

const LS='simsar_items',LD='simsar_deleted',LS_LOGS='simsar_activity_logs';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let activityLogs = ld(LS_LOGS, []);

function formatTime(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const h = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${day} ${h}:${min}`;
}

function recordActivity(action, item, oldItem = null){
  const actionNames = { add:'إضافة', edit:'تعديل', del:'حذف', undo:'تراجع' };
  const kindNames = { rent:'إيجار', sale:'بيع', furn:'مفروش', client:'عملاء' };

  const log = {
    logId: uid('log'),
    time: formatTime(),
    action: action,
    actionName: actionNames[action] || action,
    targetId: item ? item.id : (oldItem ? oldItem.id : ''),
    targetTitle: item ? (item.addr || item.name || '') : (oldItem ? (oldItem.addr || oldItem.name || '') : ''),
    targetKind: kindNames[(item && item.kind) || (oldItem && oldItem.kind) || 'rent'] || 'عنصر',
    before: oldItem ? JSON.parse(JSON.stringify(oldItem)) : null,
    after: item ? JSON.parse(JSON.stringify(item)) : null,
    isUndone: false
  };

  activityLogs.unshift(log);
  if(activityLogs.length > 250) activityLogs.pop();
  try{ localStorage.setItem(LS_LOGS, JSON.stringify(activityLogs)); }catch(e){}
  return log;
}

function undoActivity(logId){
  const log = activityLogs.find(l => l.logId === logId);
  if(!log || log.isUndone) return;

  if(log.action === 'add'){
    items = items.filter(y => y.id !== log.targetId);
    const d = ld(LD, []);
    d.push(log.targetId);
    localStorage.setItem(LD, JSON.stringify(d));
  } else if(log.action === 'del'){
    if(log.before){
      const i = items.findIndex(y => y.id === log.before.id);
      if(i < 0) items.push(log.before);
      else items[i] = log.before;
      let d = ld(LD, []);
      d = d.filter(id => id !== log.before.id);
      localStorage.setItem(LD, JSON.stringify(d));
    }
  } else if(log.action === 'edit'){
    if(log.before){
      const i = items.findIndex(y => y.id === log.before.id);
      if(i < 0) items.push(log.before);
      else items[i] = log.before;
    }
  }

  log.isUndone = true;
  try{ localStorage.setItem(LS_LOGS, JSON.stringify(activityLogs)); }catch(e){}
  save();
  render();
  showHistorySheet();
  toast('تم التراجع بنجاح واستعادة البيانات ↩️');

  if(gsUrl){
    syncToSheet({ action: 'undo', logId: logId, log: log });
  }
}

function showHistorySheet(){
  const rows = activityLogs;
  const listHtml = rows.length ? rows.map(l => {
    let actionBadge = '';
    if(l.action==='add') actionBadge = '<span class="badge avail">🟢 إضافة</span>';
    else if(l.action==='edit') actionBadge = '<span class="badge nego">🟡 تعديل</span>';
    else if(l.action==='del') actionBadge = '<span class="badge done">🔴 حذف</span>';
    else actionBadge = '<span class="badge soon">↩️ تراجع</span>';

    return `
      <div class="log-card ${l.isUndone ? 'undone' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div style="display:flex;align-items:center;gap:6px">
            ${actionBadge}
            <span style="font-size:12px;font-weight:700;color:var(--tx-soft)">${esc(l.targetKind)}</span>
          </div>
          <span style="font-size:11.5px;color:var(--mut);direction:ltr;font-weight:600">${esc(l.time)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px">
          <div style="font-weight:800;font-size:15px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.targetTitle || 'عنصر')}</div>
          ${l.isUndone
            ? '<span class="badge-undone">تم التراجع ✅</span>'
            : `<button class="btn-undo" data-logid="${esc(l.logId)}">${ICONS.undo} <span>تراجع (UNDO)</span></button>`
          }
        </div>
      </div>
    `;
  }).join('') : `
    <div class="empty">
      <div style="font-size:42px;margin-bottom:8px">🕒</div>
      <div style="font-weight:800;font-size:16px;color:var(--tx)">سجل النشاط فارغ</div>
      <div style="font-size:13px;color:var(--mut);margin-top:4px">أي إضافة أو تعديل أو حذف هيتسجل هنا فوراً وتقدر تتراجع عنه</div>
    </div>
  `;

  open(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)">
      <h3 style="margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--tx)">
        ${ICONS.history} <span>سجل النشاط والتراجع</span>
      </h3>
      <button id="h_close" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease" title="إغلاق">${ICONS.close}</button>
    </div>
    <div style="max-height:68vh;overflow-y:auto;padding:2px">
      ${listHtml}
    </div>
    <div class="acts" style="margin-top:12px">
      <button class="btn" id="h_cl">${ICONS.close} <span>إغلاق</span></button>
    </div>
  `);

  $('h_close').onclick = close;
  $('h_cl').onclick = close;
  document.querySelectorAll('.btn-undo').forEach(btn => {
    btn.onclick = () => undoActivity(btn.dataset.logid);
  });
}

$('btn_history').onclick = showHistorySheet;

function save(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){toast('التخزين ممتلي')}}
function put(x){
  const i=items.findIndex(y=>y.id==x.id);
  const oldItem=i>=0?JSON.parse(JSON.stringify(items[i])):null;
  const actionType=i>=0?'edit':'add';

  i<0?items.push(x):items[i]=x;
  save();
  render();

  const log=recordActivity(actionType,x,oldItem);
  if(gsUrl)syncToSheet({action:'put',item:x,log:log});
}
function del(id){
  const oldItem=items.find(y=>y.id==id);
  items=items.filter(y=>y.id!=id);
  const d=ld(LD,[]);
  d.push(id);
  localStorage.setItem(LD,JSON.stringify(d));
  save();
  render();

  if(oldItem){
    const log=recordActivity('del',null,oldItem);
    if(gsUrl)syncToSheet({action:'del',id:id,log:log});
  }else if(gsUrl){
    syncToSheet({action:'del',id:id});
  }
}
items=ld(LS,[]);
const gone=new Set(ld(LD,[]));
(window.SIMSAR_DATA||[]).forEach(x=>{if(x.id&&!gone.has(x.id)&&!items.some(y=>y.id==x.id))items.push(x)});
save();loaded=true;render();
updateSyncStatus(gsUrl?'online':'local');
if(gsUrl)loadFromGoogleSheets(true);

// PWA & Service Worker
let deferredPrompt = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => {
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          if (installingWorker) {
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                toast('تم تحديث السيستم لأحدث إصدار تلقائياً 🚀');
              }
            };
          }
        };
      })
      .catch((err) => console.log('SW registration error:', err));
  });
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

function promptInstallApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choice) => {
      if (choice.outcome === 'accepted') {
        toast('تم تثبيت التطبيق بنجاح 🎉');
      }
      deferredPrompt = null;
    });
  } else {
    open(`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd)">
        <h3 style="margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--tx)">
          📱 <span>تثبيت تطبيق مدينتي</span>
        </h3>
        <button id="pwa_close" style="width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer" title="إغلاق">${ICONS.close}</button>
      </div>
      <div style="line-height:1.7;font-size:13.5px;color:var(--tx-soft)">
        <div style="background:var(--pri-light);border:1.5px solid var(--pri-surface);border-radius:12px;padding:12px;margin-bottom:12px">
          <strong style="color:var(--pri);display:block;margin-bottom:4px">🌟 مميزات تثبيت التطبيق:</strong>
          • يعمل كتطبيق شاشة كاملة بدون شريط المتصفح وبأيقونة على الشاشة الرئيسية.<br>
          • يفتح بسرعة فائقة وبدون نت (Offline First).<br>
          • <strong>أي تعديل يظهر فوراً:</strong> عند إضافة شقق جديدة أو تعديل السيستم يسمع تلقائياً عند الجميع.
        </div>
        <div style="margin-bottom:10px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)">
          <strong style="color:var(--tx);display:block;margin-bottom:3px">🤖 لمستخدمي أندرويد (Google Chrome):</strong>
          اضغط على زر القائمة (الثلاث نقاط <strong>⋮</strong>) بأعلى المتصفح ⬅️ اختر <strong>"تثبيت التطبيق"</strong> أو <strong>"إضافة إلى الشاشة الرئيسية"</strong>.

        </div>
      </div>
      <div class="acts" style="margin-top:14px">
        <button class="btn p" id="pwa_ok" style="flex:1">فهمت، حسناً 👍</button>
      </div>
    `);
    $('pwa_close').onclick = close;
    $('pwa_ok').onclick = close;
  }
}

if ($('btn_install')) {
  $('btn_install').onclick = promptInstallApp;
